services:
  marketmind:
    build:
      context: ./marketmind
      dockerfile: Dockerfile
    container_name: marketmind
    ports:
      - "5667:5667"
    environment:
      PORT: "5667"
      HOST: 0.0.0.0
      MM_PORT: "5667"
      MM_DATABASE_PATH: /app/data/marketmind.db
    volumes:
      - marketmind-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5667/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  marketmind-data:
