services:
  marketmind:
    build:
      context: ./marketmind
      dockerfile: Dockerfile
    container_name: marketmind
    ports:
      - "5667:5667"
    env_file:
      - ./marketmind/.env
    environment:
      PORT: "5667"
      HOST: 0.0.0.0
      MM_PORT: "5667"
      MM_RUNTIME: docker
    volumes:
      - ${MARKETMIND_DATA_DIR}:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5667/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
