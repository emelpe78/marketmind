name: Bug melden
description: Etwas funktioniert nicht wie erwartet
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Bitte keine API-Keys oder persönlichen Daten anhängen.
  - type: textarea
    id: description
    attributes:
      label: Was ist passiert?
      description: Kurze Beschreibung des Problems
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. Gehe zu …
        2. Klicke auf …
        3. Fehler erscheint
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MarketMind-Version
      placeholder: z. B. 0.4.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Umgebung
      options:
        - Dev (npm run dev)
        - Docker
        - Production-Build
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Zusätzlicher Kontext
      description: Logs, Screenshots, Browser/OS
